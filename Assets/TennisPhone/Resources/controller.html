<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Raquette</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #10151c; color: #eef2f6;
    font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px; text-align: center;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  #status { min-height: 3em; margin: 0 0 22px; color: #a9b6c4; }
  #status.ok { color: #6fdc8c; }
  #status.error { color: #ff8f7a; }
  button {
    width: 100%; border: 0; border-radius: 18px; padding: 22px 16px;
    font: inherit; font-size: 21px; font-weight: 700;
    background: #2f80ed; color: #fff;
  }
  button:active { background: #2567c2; }
  button.secondary { margin-top: 12px; background: #263341; font-size: 17px; font-weight: 600; padding: 16px; }
  #live { margin-top: 22px; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #a9b6c4; text-align: left; white-space: pre; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.18s ease-out; }
  #hapticBox { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Raquette</h1>
  <p id="status">Touchez le bouton pour connecter le téléphone au jeu.</p>
  <button id="start" type="button">Activer la raquette</button>
  <button id="simulate" type="button" class="secondary" hidden>Utiliser des capteurs simulés</button>
  <div id="live" hidden></div>
</main>
<div id="flash"></div>
<div id="hapticBox"><label id="hapticLabel" for="hapticSwitch">.</label><input id="hapticSwitch" type="checkbox" switch></div>
<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  var startButton = document.getElementById('start');
  var simulateButton = document.getElementById('simulate');
  var liveEl = document.getElementById('live');
  var flashEl = document.getElementById('flash');
  var hapticLabel = document.getElementById('hapticLabel');

  var socket = null;
  var started = false;
  var simulated = false;
  var lastSent = 0;
  var sentThisSecond = 0;
  var rate = 0;
  var roundTrip = -1;
  var orientation = [0, 0, 0];
  var motionEvents = 0;
  var audioContext = null;
  var wakeLock = null;
  var lastLine = '';

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function num(value) {
    return (value === null || value === undefined || isNaN(value)) ? '0' : value.toFixed(3);
  }

  function send(line) {
    if (socket && socket.readyState === 1) {
      socket.send(line);
      return true;
    }
    return false;
  }

  function connect() {
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(scheme + location.host + '/ws');
    socket.onopen = function () {
      send('h,' + navigator.userAgent.replace(/,/g, ' ').slice(0, 140));
      ping();
      refreshStatus();
    };
    socket.onmessage = function (event) { onMessage(String(event.data)); };
    socket.onclose = function () {
      socket = null;
      roundTrip = -1;
      setStatus('Connexion au jeu perdue. Nouvelle tentative…', 'error');
      setTimeout(connect, 1000);
    };
    socket.onerror = function () {};
  }

  function ping() {
    send('p,' + performance.now().toFixed(1));
  }

  function onMessage(data) {
    var parts = data.split(',');
    if (parts[0] === 'q') {
      var now = performance.now();
      var sentAt = parseFloat(parts[1]);
      var serverTime = parseFloat(parts[2]);
      roundTrip = now - sentAt;
      var offset = serverTime - (sentAt + roundTrip / 2);
      send('s,' + roundTrip.toFixed(1) + ',' + offset.toFixed(1));
    } else if (parts[0] === 'v') {
      haptic(parseInt(parts[1], 10) || 30);
    }
  }

  function sendSample(now, a, g, r) {
    if (now - lastSent < 14) { return; }
    lastSent = now;
    lastLine = 'm,' + now.toFixed(1) + ',' +
      num(a.x) + ',' + num(a.y) + ',' + num(a.z) + ',' +
      num(g.x) + ',' + num(g.y) + ',' + num(g.z) + ',' +
      num(r.alpha) + ',' + num(r.beta) + ',' + num(r.gamma) + ',' +
      num(orientation[0]) + ',' + num(orientation[1]) + ',' + num(orientation[2]);
    if (send(lastLine)) { sentThisSecond++; }
  }

  function onMotion(event) {
    motionEvents++;
    if (simulated) { return; }
    sendSample(performance.now(),
      event.acceleration || {}, event.accelerationIncludingGravity || {}, event.rotationRate || {});
  }

  function onOrientation(event) {
    if (simulated) { return; }
    orientation = [event.alpha || 0, event.beta || 0, event.gamma || 0];
  }

  function startSimulation() {
    simulated = true;
    simulateButton.hidden = true;
    setInterval(function () {
      var now = performance.now();
      var t = now / 1000;
      orientation = [(t * 40) % 360, 45 + 30 * Math.sin(t * 1.3), 20 * Math.sin(t * 0.9)];
      var burst = Math.max(0, Math.sin(t * 2.2));
      sendSample(now,
        { x: 12 * burst * Math.sin(t * 9), y: 6 * burst, z: 3 * Math.cos(t * 5) },
        { x: 0.5, y: -6.9, z: -6.9 },
        { alpha: 300 * burst, beta: 120 * Math.sin(t * 3), gamma: 60 * Math.cos(t * 2) });
    }, 16);
    refreshStatus();
  }

  function unlockAudio() {
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) { return; }
      audioContext = audioContext || new AudioContextClass();
      if (audioContext.state === 'suspended') { audioContext.resume(); }
    } catch (error) { audioContext = null; }
  }

  function requestWakeLock() {
    if (!navigator.wakeLock || document.visibilityState !== 'visible') { return; }
    navigator.wakeLock.request('screen').then(function (lock) { wakeLock = lock; }).catch(function () {});
  }

  // Retour à l'impact : vibration si le navigateur la propose, sinon petit bruit et flash.
  function haptic(milliseconds) {
    if (navigator.vibrate) { navigator.vibrate(milliseconds); }
    try { hapticLabel.click(); } catch (error) {}
    try {
      // Variante du contournement iOS : un interrupteur créé à la volée puis basculé.
      var label = document.createElement('label');
      label.setAttribute('aria-hidden', 'true');
      label.style.display = 'none';
      var toggle = document.createElement('input');
      toggle.type = 'checkbox';
      toggle.setAttribute('switch', '');
      label.appendChild(toggle);
      document.head.appendChild(label);
      label.click();
      document.head.removeChild(label);
    } catch (error) {}
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '0.35';
    requestAnimationFrame(function () {
      flashEl.style.transition = '';
      flashEl.style.opacity = '0';
    });
    if (audioContext) {
      try {
        var oscillator = audioContext.createOscillator();
        var gain = audioContext.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(190, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(70, audioContext.currentTime + 0.07);
        gain.gain.setValueAtTime(0.5, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.09);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.1);
      } catch (error) {}
    }
  }

  function refreshStatus() {
    if (!started) { return; }
    if (!socket || socket.readyState !== 1) { return; }
    var source = simulated ? 'capteurs simulés' : 'capteurs du téléphone';
    var latency = roundTrip >= 0 ? roundTrip.toFixed(0) + ' ms' : '…';
    setStatus('Raquette active (' + source + ')\n' + rate + ' mesures/s · aller-retour ' + latency, 'ok');
    statusEl.style.whiteSpace = 'pre-line';
    if (lastLine) {
      var v = lastLine.split(',');
      liveEl.hidden = false;
      liveEl.textContent =
        'accél.   ' + v[2] + '  ' + v[3] + '  ' + v[4] + '\n' +
        'rotation ' + v[8] + '  ' + v[9] + '  ' + v[10] + '\n' +
        'orient.  ' + v[11] + '  ' + v[12] + '  ' + v[13];
    }
  }

  function start() {
    if (started) { return; }
    unlockAudio();

    var permissions = [];
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        permissions.push(DeviceMotionEvent.requestPermission());
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        permissions.push(DeviceOrientationEvent.requestPermission());
      }
    } catch (error) {
      setStatus('Impossible de demander l\'accès aux capteurs : ' + error, 'error');
      return;
    }

    Promise.all(permissions).then(function (results) {
      for (var i = 0; i < results.length; i++) {
        if (results[i] !== 'granted') {
          setStatus('Accès aux capteurs refusé. Fermez cet onglet, rouvrez la page et acceptez la demande.', 'error');
          return;
        }
      }

      started = true;
      startButton.hidden = true;
      setStatus('Connexion au jeu…');
      window.addEventListener('devicemotion', onMotion);
      window.addEventListener('deviceorientation', onOrientation);
      requestWakeLock();
      connect();

      if (/[?&]sim=1/.test(location.search)) {
        startSimulation();
      } else {
        setTimeout(function () {
          if (motionEvents === 0 && !simulated) {
            setStatus('Aucun capteur de mouvement détecté sur cet appareil.', 'error');
            simulateButton.hidden = false;
          }
        }, 1500);
      }
    }).catch(function (error) {
      setStatus('Accès aux capteurs impossible : ' + error, 'error');
    });
  }

  startButton.addEventListener('click', start);
  simulateButton.addEventListener('click', startSimulation);
  document.addEventListener('visibilitychange', function () {
    if (started && document.visibilityState === 'visible') { requestWakeLock(); }
  });

  setInterval(function () {
    rate = sentThisSecond;
    sentThisSecond = 0;
    ping();
    refreshStatus();
  }, 1000);

  if (!window.isSecureContext) {
    setStatus('Cette page doit être ouverte en HTTPS pour accéder aux capteurs.', 'error');
  }
})();
</script>
</body>
</html>
